<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
    <title>Convert | NIXXA</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="convert-app">
        <header><a href="../homepage/index.html">&#8592;</a><span>Convert</span><button id="help">?</button></header>
        <p class="eyebrow">NIXXA CONVERT</p>
        <h1>Convert your money</h1>
        <p class="intro">Move between USD and Bitcoin instantly.</p>
        <section class="rate"><span>Current BTC price</span><b>$63,722.20</b><small>Demo exchange rate</small></section>
        <section class="converter"><label>You convert</label>
            <div class="currency-field"><input id="from-amount" inputmode="decimal" value="100"><select
                    id="from-currency">
                    <option value="USD">USD</option>
                    <option value="BTC">BTC</option>
                </select></div><button class="swap" id="swap">&#8645;</button><label>You receive</label>
            <div class="currency-field output"><input id="to-amount" readonly><select id="to-currency">
                    <option value="BTC">BTC</option>
                    <option value="USD">USD</option>
                </select></div>
            <p id="wallet-note">From your NIXXA USD wallet</p>
        </section>
        <section class="quick"><button data-value="50">$50</button><button data-value="100">$100</button><button
                data-value="500">$500</button><button data-value="max">MAX</button></section>
        <section class="summary">
            <div><span>Exchange rate</span><b>1 BTC = $63,722.20</b></div>
            <div><span>Conversion fee</span><b>$0.00</b></div>
            <div class="receive"><span>You receive</span><b id="summary-value"></b></div>
        </section><button class="review" id="review">Review conversion</button>
    </main>
    <div class="modal hidden" id="modal">
        <section><button id="close">&times;</button>
            <div id="modal-content"></div>
        </section>
    </div>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
</body>

</html>
