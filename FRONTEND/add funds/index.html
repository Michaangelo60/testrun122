<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>Add Funds | Nexos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="back-button" href="../index.html" aria-label="Go back">&#8592;</a>
      <h1>Add Funds</h1>
      <button class="help-button" type="button" aria-label="Get help">?</button>
    </header>

    <section class="hero" aria-labelledby="add-funds-heading">
      <span class="eyebrow">YOUR WALLET</span>
      <h2 id="add-funds-heading">Choose how you want to add funds to your account</h2>
      <p>Select an option below to get started.</p>
    </section>

    <section class="fund-options" aria-label="Add funds options">
      <a class="fund-card" href="../deposite/index.html" aria-label="Buy Dollar">
        <span class="option-icon wallet-icon" aria-hidden="true"><span></span></span>
        <span class="option-copy"><strong>Buy Dollar</strong><small>Add fund to your wallet balance</small></span>
        <span class="chevron" aria-hidden="true">&#8250;</span>
      </a>

      <button class="fund-card" type="button" data-option="Transfer to Collateral">
        <span class="option-icon transfer-icon" aria-hidden="true"><span>&#8594;</span></span>
        <span class="option-copy"><strong>Transfer to Collateral</strong><small>Move funds from your main savings balance into collateral</small></span>
        <span class="chevron" aria-hidden="true">&#8250;</span>
      </button>

      <button class="fund-card" type="button" data-option="Add Collateral">
        <span class="option-icon shield-icon" aria-hidden="true">&#9830;</span>
        <span class="option-copy"><strong>Deposit Bitcoin</strong><small>Deposit Bitcoin as through wallet address</small></span>
        <span class="chevron" aria-hidden="true">&#8250;</span>
      </button>
    </section>

    <aside class="security-note">
      <span class="lock" aria-hidden="true">&#128274;</span>
      <p>Your funds are secured with industry-standard protection.</p>
    </aside>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" hidden>
    <section class="confirmation-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <span class="modal-icon" aria-hidden="true"></span>
      <h2 id="modal-title"></h2>
      <p id="modal-message"></p>
      <label class="transfer-amount-label" for="transfer-amount">Amount to transfer</label>
      <div class="transfer-amount-field">
        <span class="amount-currency"></span>
        <input id="transfer-amount" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </div>
      <p class="amount-error" role="alert"></p>
      <div class="modal-actions">
        <button class="modal-button cancel-button" type="button">Cancel</button>
        <button class="modal-button confirm-button" type="button">Confirm transfer</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
